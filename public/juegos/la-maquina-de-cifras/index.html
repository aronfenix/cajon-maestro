<!doctype html>
<html lang="es">
<head>

<title>La máquina de cifras · La cajonera</title>
<meta name="description" content="Coloca cifras para formar el mayor, el menor, el más cercano o el par más grande. Adaptativo, con rondas a ciegas.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../motores/base.css">

<body>
<!--
  Este juego no tiene código propio: todo lo que cambia está en el bloque de abajo.

  Instrucciones de cada motor: ../motores/

<script type="application/json" id="config">
{
  "motor": "cifras",
  "area": "matematicas",
  "titulo": "La máquina de cifras",
  "subtitulo": "Cada hueco vale distinto según dónde esté. Los retos se complican cuando los vas clavando.",
  "saludo": "Arrastra cada cifra con el dedo hasta su hueco. **El hueco de la izquierda es el que más vale.**",
  "volver": "../../materiales/la-maquina-de-cifras/",
  "observa": "¿Dónde pones la cifra más grande cuando buscas el número mayor? ¿Y en las rondas **a ciegas**, dónde pones un 5 si es la primera que sale?",
  "niveles": [
    {
      "generar": true,
      "huecos": 3,
      "objetivo": "max"
    },
    {
      "generar": true,
      "huecos": 4,
      "objetivo": "max"
    },
    {
      "generar": {
        "conCero": true
      },
      "huecos": 4,
      "objetivo": "min",
      "explica": "El 0 no puede ir delante: el número dejaría de tener cuatro cifras."
    },
    {
      "generar": true,
      "huecos": 4,
      "objetivo": "max",
      "condicion": "par"
    },
    {
      "generar": {
        "conCero": true
      },
      "huecos": 5,
      "objetivo": "min",
      "condicion": "impar"
    },
    {
      "generar": {
        "cerca": [
          3000,
          7000
        ]
      },
      "huecos": 4,
      "objetivo": "cerca"
    },
    {
      "generar": {
        "cantidad": 6
      },
      "huecos": 4,
      "objetivo": "max",
      "condicion": "multiplo:5"
    },
    {
      "generar": true,
      "huecos": 4,
      "objetivo": "max",
      "aCiegas": true
    },
    {
      "generar": {
        "cantidad": 5,
        "cerca": [
          40000,
          60000
        ]
      },
      "huecos": 5,
      "objetivo": "cerca",
      "aCiegas": true
    }
  ],
  "personaje": "boli"
}
</script>
<script type="module" src="../motores/arranque.js"></script>
